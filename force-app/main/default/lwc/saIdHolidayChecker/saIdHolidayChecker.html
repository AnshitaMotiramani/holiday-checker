<template>
    <lightning-card title="South African Holiday Checker">

        <div class="slds-p-around_medium">

            <div class="description">
                <h2>Check Public Holidays</h2>
                <p>
                    Enter a South African ID Number to retrieve public holiday
                    information for the year of birth.
                </p>
            </div>

            <lightning-input
                label="South African ID Number"
                value={idNumber}
                onchange={handleIdChange}
                onkeyup={handleIdChange}
                placeholder="Enter 13-digit ID Number">
            </lightning-input>

            <template if:true={errorMessage}>
                <div class="error-message slds-m-top_x-small">
                    {errorMessage}
                </div>
            </template>

            <div class="slds-m-top_medium">
                <lightning-button
                    label="Search"
                    variant="brand"
                    onclick={handleSearch}
                    disabled={isSearchDisabled}>
                </lightning-button>
            </div>

            <template if:true={message}>
                <div class="success-message slds-m-top_medium">
                    {message}
                </div>
            </template>

            <template if:true={searchResult}>

                <div class="result-container slds-m-top_large">

                    <h3>Decoded Information</h3>

                    <p>
                        <strong>SA ID Number:</strong>
                        {searchResult.idNumber}
                    </p>

                    <p>
                        <strong>Date of Birth:</strong>
                        {searchResult.dateOfBirth}
                    </p>

                    <p>
                        <strong>Gender:</strong>
                        {searchResult.gender}
                    </p>

                    <p>
                        <strong>SA Citizen:</strong>
                        {searchResult.saCitizen}
                    </p>

                    <p>
                        <strong>Search Count:</strong>
                        {searchResult.searchCount}
                    </p>

                </div>

            </template>

        </div>

    </lightning-card>
</template>
